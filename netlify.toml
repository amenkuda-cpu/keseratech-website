# Netlify builds and serves the site with its Next.js runtime (detected automatically).
# Secrets (TURSO_*, ADMIN_*) are set in Netlify's environment settings, never in this file.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  SITE_URL = "https://keseratech.com"

# One address for search engines: the free netlify.app address forwards to the real domain.
[[redirects]]
  from = "https://keseratech.netlify.app/*"
  to = "https://keseratech.com/:splat"
  status = 301
  force = true
